name: Backend CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/tripmate-backend

jobs:
  build-and-test:
    name: Build & Test .NET API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: TripMateBE

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          cache: true
          cache-dependency-path: 'TripMateBE/**/*.csproj'

      - name: Restore dependencies
        run: dotnet restore src/TripMate.API/TripMate.API.csproj

      - name: Build solution
        run: dotnet build TripMate.sln --configuration Release --no-restore

      - name: Run Tests (if exists)
        run: |
          if [ -d "tests" ] || ls tests/*.csproj 1> /dev/null 2>&1; then
            dotnet test --no-build --verbosity normal
          else
            echo "No test projects found, skipping tests step."
          fi

  build-and-push-docker:
    name: Build & Push Docker Image to GHCR
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image (with GHA caching)
        uses: docker/build-push-action@v5
        with:
          context: ./TripMateBE
          file: ./TripMateBE/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render Auto Deploy
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_HOOK" ]; then
            echo "Triggering Render deploy hook..."
            curl -s -X POST "$RENDER_HOOK"
          else
            echo "RENDER_DEPLOY_HOOK_URL secret is not set, skipping deploy hook."
          fi
